<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Emoji Test</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#dff5ff;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

.scene{
    position:relative;
    width:100vw;
    height:100vh;
}

.house{
    position:absolute;
    right:120px;
    bottom:110px;
    font-size:120px;
}

.elephant{
    position:absolute;
    left:-120px;
    bottom:115px;
    font-size:90px;
    transition:left 6s linear;
}

.ground{
    position:absolute;
    bottom:80px;
    width:100%;
    height:6px;
    background:#5b8c4a;
}
</style>

</head>
<body>

<div class="scene">

<div id="elephant" class="elephant">🐘</div>

<div id="house" class="house">🏠</div>

<div class="ground"></div>

</div>

<script>

const elephant = document.getElementById("elephant");

function playAnimation(){

    elephant.style.transition="none";
    elephant.style.left="-120px";
    elephant.style.opacity="1";

    void elephant.offsetWidth;

    elephant.style.transition="left 6s linear";
    elephant.style.left="72%";

    setTimeout(()=>{
        elephant.style.opacity="0";
    },5900);

}

playAnimation();

setInterval(playAnimation,8000);

</script>

</body>
</html>
