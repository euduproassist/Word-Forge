<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Forge Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Responsive Mobile Shell to keep exact proportions across all screens */
        .phone-viewport {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 932px;
            overflow: hidden;
            background-color: #000;
        }

        /* Screen Wrapper */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
        }

        /* Screen 1: Logo Splash */
        #screen-1 {
            background-color: #000;
            background-image: url('assets/logo.png');
        }

        /* Screen 2 & 3 Backgrounds */
        #screen-2 {
            background-image: url('assets/load.png');
        }

        #screen-3 {
            background-image: url('assets/menu.png');
        }

        /* Shop Carousel Screen Container (Fixed Background) */
        #screen-4 {
            background-image: url('assets/pass.png');
            overflow: hidden;
        }

        /* Carousel Track System for Smooth Vertical Sliding Cards */
        .shop-carousel-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: pan-y;
        }

        .shop-carousel-track {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 300%;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .shop-slide {
            width: 100%;
            height: 33.3333%;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        #shop-slide-1 {
            background-image: url('assets/pass.png');
        }

        #shop-slide-2 {
            background-image: url('assets/coin.png');
        }

        #shop-slide-3 {
            background-image: url('assets/ads.png');
        }

        /* 
          PIXEL-PERFECT LOADING BAR SLOT 
          Aligned precisely to match the exact dimensions and position on load.png
        */
        .loading-slot {
            position: absolute;
            top: 80.5%;
            left: 10.5%;
            width: 79%;
            height: 14px;
            background: transparent;
            border-radius: 20px;
            overflow: hidden;
        }

        .loading-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b6ef3, #7697ff);
            border-radius: 20px;
            transition: width 0.05s linear;
        }

        /* 
          PERCENTAGE TEXT SLOT 
          Positioned neatly right beneath the loading bar slot
        */
        .percentage-slot {
            position: absolute;
            top: 84.2%;
            left: 50%;
            transform: translateX(-50%);
            color: #1a2b4c;
            font-weight: bold;
            font-size: 13px;
        }

        /* 
          PIXEL-PERFECT "BEGIN YOUR JOURNEY" BUTTON SLOT 
          Matches assets/menu.png precisely
        */
        .journey-slot {
            position: absolute;
            top: 56.1%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 78%;
            height: 60px;
            background: transparent;
            border: none;
            cursor: pointer;
            border-radius: 30px;
        }

        /* 
          NEW SHOP / PASS BUTTON SLOTS (COINS & HINTS FOOTER)
          Positioned over the bottom coin/hint bar on menu.png
        */
        .shop-slot {
            position: absolute;
            bottom: 3.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 82%;
            height: 65px;
            background: transparent;
            border: none;
            cursor: pointer;
            border-radius: 20px;
        }

        /* 
          NEW BACK BUTTON SLOT ON SHOP SCREEN 
          Positioned over the back arrow top-left on assets/pass.png
        */
        .back-slot {
            position: absolute;
            top: 4.5%;
            left: 6%;
            width: 48px;
            height: 48px;
            background: transparent;
            border: none;
            cursor: pointer;
            border-radius: 50%;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div class="phone-viewport">
        <!-- SCREEN 1: Logo Splash (Shows for 3 seconds, fades out) -->
        <div class="screen active" id="screen-1"></div>

        <!-- SCREEN 2: Loading State -->
        <div class="screen" id="screen-2">
            <div class="loading-slot">
                <div class="loading-fill" id="progress-fill"></div>
            </div>
            <div class="percentage-slot" id="percent-count">0%</div>
        </div>

        <!-- SCREEN 3: Main Menu -->
        <div class="screen" id="screen-3">
            <button class="journey-slot" onclick="alert('Journey Started!')"></button>
            <button class="shop-slot" onclick="openShop()"></button>
        </div>

        <!-- SCREEN 4: Shop / Pass Carousel Screen -->
        <div class="screen" id="screen-4">
            <div class="shop-carousel-container" id="carousel-container">
                <div class="shop-carousel-track" id="carousel-track">
                    <!-- Slide 1: Pass Screen (assets/pass.png) -->
                    <div class="shop-slide" id="shop-slide-1">
                        <button class="back-slot" onclick="closeShop()"></button>
                    </div>
                    <!-- Slide 2: Coin Screen (assets/coin.png) -->
                    <div class="shop-slide" id="shop-slide-2">
                        <button class="back-slot" onclick="closeShop()"></button>
                    </div>
                    <!-- Slide 3: Ads Screen (assets/ads.png) -->
                    <div class="shop-slide" id="shop-slide-3">
                        <button class="back-slot" onclick="closeShop()"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const screen1 = document.getElementById('screen-1');
        const screen2 = document.getElementById('screen-2');
        const screen3 = document.getElementById('screen-3');
        const screen4 = document.getElementById('screen-4');
        const progressFill = document.getElementById('progress-fill');
        const percentCount = document.getElementById('percent-count');
        const carouselTrack = document.getElementById('carousel-track');
        const carouselContainer = document.getElementById('carousel-container');

        window.addEventListener('DOMContentLoaded', () => {
            // Step 1: Display Logo Splash for 3 seconds
            setTimeout(() => {
                screen1.classList.remove('active');
                screen2.classList.add('active');
                
                // Step 2: Smooth loading progress animation (~2.5 seconds)
                let currentProgress = 0;
                const loadingInterval = setInterval(() => {
                    currentProgress += 1;
                    if (currentProgress <= 100) {
                        progressFill.style.width = currentProgress + '%';
                        percentCount.innerText = currentProgress + '%';
                    } else {
                        clearInterval(loadingInterval);
                        
                        // Step 3: Transition cleanly to Menu screen
                        setTimeout(() => {
                            screen2.classList.remove('active');
                            screen3.classList.add('active');
                        }, 300);
                    }
                }, 25);
                
            }, 3000);
        });

        let currentSlide = 0; // 0 = Pass, 1 = Coin, 2 = Ads

        function updateSlide(smooth = true) {
            if (!smooth) {
                carouselTrack.style.transition = 'none';
            } else {
                carouselTrack.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
            }
            const percentage = currentSlide * -(100 / 3);
            carouselTrack.style.transform = `translateY(${percentage}%)`;

            if (!smooth) {
                carouselTrack.offsetHeight; // Force reflow
                carouselTrack.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
            }
        }

        // Navigation Functions for Shop / Pass Screen
        function openShop() {
            screen3.classList.remove('active');
            screen4.classList.add('active');

            // Instantly jump to slide 3 (Ads / bottom) without transition
            currentSlide = 2;
            updateSlide(false);

            // In a split second, automatically slide up to slide 2 (Coin), then slide up to slide 1 (Pass)
            setTimeout(() => {
                currentSlide = 1;
                updateSlide(true);

                setTimeout(() => {
                    currentSlide = 0;
                    updateSlide(true);
                }, 700); // 700ms pause before sliding to Pass
            }, 300); // Initial 300ms pause at Ads
        }

        function closeShop() {
            screen4.classList.remove('active');
            screen3.classList.add('active');
        }

        // Touch / Swipe Gestures Support for Vertical Swiping
        let touchStartY = 0;
        let touchEndY = 0;

        carouselContainer.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        carouselContainer.addEventListener('touchend', (e) => {
            touchEndY = e.changedTouches[0].clientY;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 40;
            const diff = touchStartY - touchEndY;

            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    // Swiped UP -> Go to next slide (downwards visually)
                    if (currentSlide === 0) {
                        currentSlide = 1; // Pass -> Coin
                        updateSlide(true);
                    } else if (currentSlide === 1) {
                        currentSlide = 2; // Coin -> Ads
                        updateSlide(true);
                    }
                } else {
                    // Swiped DOWN -> Go to previous slide (upwards visually)
                    if (currentSlide === 1) {
                        currentSlide = 0; // Coin -> Pass
                        updateSlide(true);
                    } else if (currentSlide === 2) {
                        currentSlide = 1; // Ads -> Coin
                        updateSlide(true);
                    }
                }
            }
        }
    </script>
</body>
</html>
